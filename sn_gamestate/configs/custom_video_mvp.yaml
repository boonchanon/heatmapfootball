# Minimal real-video path: detector, IoU/motion tracker, pitch keypoints, projection.
defaults:
  - custom_video
  - override modules/track: bpbreid_strong_sort
  - override visualization: none
  - _self_

pipeline:
  - bbox_detector
  - reid
  - track
  - pitch
  - calibration

modules:
  bbox_detector: {batch_size: 1}
  reid: {batch_size: 8}
  track:
    batch_size: 1
    cfg:
      ecc: true
      # Football players often look alike.  Keep an existing identity only when
      # both appearance and predicted location remain a reasonably close match.
      # This deliberately prefers a short new track over silently swapping IDs.
      max_dist: 0.35
      max_iou_distance: 0.65
      gating_thres_factor: 0.85
      max_age: 75
      # Do not keep drawing a Kalman-only box for almost a second after the
      # detector has lost it; that was the main source of visibly drifting boxes.
      max_kalman_prediction_without_update: 10
      n_init: 3
  pitch: {batch_size: 1}
  calibration:
    batch_size: 1
    use_prev_homography: false
