services:
  - type: web
    name: sn-gamestate-web
    runtime: python
    plan: free
    buildCommand: uv sync --frozen --no-dev && uv run --no-sync mim install mmcv==2.0.1
    startCommand: uv run --no-sync python tools/web_app.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.25
      - key: WEB_JOBS_DIR
        value: /tmp/sn-gamestate/web_jobs
      - key: MODEL_DIR
        value: /tmp/sn-gamestate/pretrained_models
      - key: MAX_UPLOAD_BYTES
        value: "104857600"
      - key: MAX_JOB_RSS_MB
        value: "380"
      # Small hosted instance: keep the original frame ceiling (local default is 15000).
      - key: MAX_ANALYSIS_FRAMES
        value: "7200"
